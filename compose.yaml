services:
  postgres:
    image: postgres:16
    container_name: people-postgres

    environment:
      POSTGRES_DB: people_specification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d people_specification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=people_specification_db;Username=postgres;Password=postgres
      JWT_KEY: ${JWT_KEY:?JWT_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: